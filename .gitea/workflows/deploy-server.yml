name: deploy-server

on:
  push:
    branches: [main]
    paths:
      - 'server/src/**'
      - 'server/scripts/**'
      - 'server/sql/**'
      - 'server/package.json'
      - 'server/Dockerfile'
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      GIT_TERMINAL_PROMPT: "0"

    defaults:
      run:
        shell: sh

    steps:
      - name: 准备工具
        run: |
          # 换国内镜像源，避免 apk 从 dl-cdn.alpinelinux.org 慢速下载（大瓶颈）
          sed -i 's#dl-cdn.alpinelinux.org#mirrors.aliyun.com#' /etc/apk/repositories
          apk add --no-cache git rsync docker-cli docker-cli-compose

      - name: 拉取代码
        run: |
          rm -rf /work
          git clone --depth 1 "http://ljx:${{ secrets.GITEA_TOKEN }}@127.0.0.1:3000/ljx/blog.git" /work

      - name: 同步代码到部署目录
        run: |
          cp -a /work/server/src/. /deploy/src/
          cp -a /work/server/scripts/. /deploy/scripts/
          cp -a /work/server/sql/. /deploy/sql/
          cp -a /work/server/package.json /work/server/Dockerfile /deploy/

      - name: 构建镜像
        run: docker build --network=host -t server-app:latest /deploy

      - name: 重建应用容器
        run: |
          # 只处理 app 服务（--no-deps），mysql 由 restart 策略自管，不随推送重建；
          # 必须在宿主机同路径下执行 compose：compose 会按配置文件所在目录解析相对路径
          # （./sql、.env），若用 /deploy 挂载点执行，相对路径会被解析成容器内路径，导致容器启动失败
          cd /volume1/docker/blog/server && docker compose -p server up -d --no-build --no-deps app

      - name: 验证
        run: |
          sleep 6
          wget -qO- http://127.0.0.1:3001/api/health
          echo
