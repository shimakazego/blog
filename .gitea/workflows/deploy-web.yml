name: deploy-web

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.gitea/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    container:
      # 显式指定轩辕镜像的 node 基础镜像 + 挂载宿主机持久构建缓存
      # （缓存路径需在 runner 配置 valid_volumes 中；挂载失败时逻辑自动降级为普通 npm ci）
      image: docker.xuanyuan.run/library/node:20-alpine
      options: --volume /volume1/docker/ci-cache:/ci-cache
    env:
      GIT_TERMINAL_PROMPT: "0"

    defaults:
      run:
        shell: sh

    steps:
      - name: 准备工具
        run: |
          # 换国内镜像源，避免 apk 从 dl-cdn.alpinelinux.org 慢速下载（大瓶颈）
          sed -i 's#dl-cdn.alpinelinux.org#mirrors.aliyun.com#' /etc/apk/repositories
          apk add --no-cache git rsync

      - name: 拉取代码
        run: |
          rm -rf /work
          git clone --depth 1 "http://ljx:${{ secrets.GITEA_TOKEN }}@127.0.0.1:3000/ljx/blog.git" /work

      - name: 安装依赖（持久缓存：lock 未变直接复用 node_modules）
        working-directory: /work
        run: |
          mkdir -p /ci-cache/npm
          LOCK_HASH=$(md5sum package-lock.json | cut -d' ' -f1)
          if [ -d /ci-cache/node_modules ] && [ -f /ci-cache/lock.hash ] && [ "$(cat /ci-cache/lock.hash)" = "$LOCK_HASH" ]; then
            echo "cache hit (lock=$LOCK_HASH)，跳过 npm ci"
            ln -s /ci-cache/node_modules node_modules
          else
            echo "cache miss (lock=$LOCK_HASH)，执行 npm ci（npmmirror + tarball 缓存）"
            npm ci --no-audit --no-fund --registry=https://registry.npmmirror.com --cache /ci-cache/npm --prefer-offline
            rm -rf /ci-cache/node_modules
            cp -a node_modules /ci-cache/node_modules
            echo "$LOCK_HASH" > /ci-cache/lock.hash
          fi

      - name: 构建
        working-directory: /work
        run: npm run build

      - name: 部署到 nginx-test（备份 + 后端图片同步）
        run: |
          STAMP=$(date +%Y%m%d-%H%M%S)
          if [ -d /deploy-parent/html ]; then
            cp -a /deploy-parent/html "/deploy-parent/html.bak-$STAMP"
          fi
          find /deploy-parent/html -mindepth 1 -delete
          cp -a /work/dist/. /deploy-parent/html/
          for d in character wengine drive_disc bangboo boss_image buff_image calculator_image guestbook_image attribute_image shiyu_boss; do
            if [ -d "/zepp-backend/$d" ]; then
              mkdir -p "/deploy-parent/html/$d"
              cp -a "/zepp-backend/$d/." "/deploy-parent/html/$d/"
            fi
          done
          chown -R root:root /deploy-parent/html 2>/dev/null || true
          echo "deployed-stamp: $STAMP"

      - name: 验证线上页面
        run: |
          wget -q -S -O /dev/null "http://192.168.1.133:15001/" 2>&1 | head -1
